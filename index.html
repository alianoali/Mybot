<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل المستخدم</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body { font-family: sans-serif; padding: 24px; text-align: center; background: #ffffff; }
  .card { max-width: 400px; margin: 0 auto; padding: 20px; border-radius: 12px; background: #f5f5f5; }
  .avatar { width: 80px; height: 80px; border-radius: 50%; background: #2481cc; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 32px; margin: 0 auto 16px; overflow: hidden;}
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  button { width: 100%; padding: 14px; border: none; border-radius: 8px; background: #2481cc; color: #fff; font-size: 16px; cursor: pointer; margin-top: 20px; }
</style>
</head>
<body>
<div class="card">
  <div class="avatar" id="avatar">?</div>
  <h2 id="name">جارٍ التحميل...</h2>
  <p id="username" style="color: gray;"></p>
  <button onclick="register()">✅ تسجيل الآن</button>
</div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  const user = tg.initDataUnsafe.user;
  
  if (user) {
    document.getElementById("name").textContent = user.first_name + " " + (user.last_name || "");
    if (user.username) document.getElementById("username").textContent = "@" + user.username;
    if (user.photo_url) document.getElementById("avatar").innerHTML = `<img src="${user.photo_url}">`;
    else document.getElementById("avatar").textContent = user.first_name[0];
  }

  function register() {
    tg.sendData(JSON.stringify({ action: "register" }));
    tg.close();
  }
</script>
</body>
</html>
